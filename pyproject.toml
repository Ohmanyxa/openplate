[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openplate"
version = "0.4.0"
description = "Offline-first, modular ALPR reference pipeline"
readme = "README.md"
requires-python = ">=3.10,<4"
license = { text = "MIT" }
dependencies = [
  "fast-alpr[onnx]>=0.4.0,<0.5",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
openplate = "openplate.cli:main"
openplate-server = "openplate.service:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openplate"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "apps/**/.dart_tool",
  "apps/**/build",
  "apps/**/ios/Flutter/ephemeral",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

